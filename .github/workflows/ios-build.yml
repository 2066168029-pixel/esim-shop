name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Detect whether the Apple signing secrets are configured.
  detect:
    name: Detect signing setup
    runs-on: ubuntu-latest
    outputs:
      has_signing: ${{ steps.check.outputs.has_signing }}
    steps:
      - id: check
        env:
          CERT: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          PROFILE: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$CERT" ] && [ -n "$PROFILE" ] && [ -n "$TEAM" ]; then
            echo "has_signing=true" >> "$GITHUB_OUTPUT"
            echo "Signing secrets found -> signed build"
          else
            echo "has_signing=false" >> "$GITHUB_OUTPUT"
            echo "No signing secrets -> unsigned build (cannot install on device)"
          fi

  build-ios:
    name: Build iOS
    needs: detect
    runs-on: macos-15
    timeout-minutes: 60
    env:
      HAS_SIGNING: ${{ needs.detect.outputs.has_signing }}
      # Mirrors match the mirror used by the local pub cache (pub.flutter-io.cn).
      # Override via repository variables if your runner can reach the
      # official registries directly.
      PUB_HOSTED_URL: ${{ vars.PUB_HOSTED_URL || 'https://pub.dev' }}
      FLUTTER_STORAGE_BASE_URL: ${{ vars.FLUTTER_STORAGE_BASE_URL || 'https://storage.googleapis.com' }}
      COCOAPODS_DISABLE_STATS: 'true'

    steps:
      # Repository layout:
      #   esim_app/   Flutter app (contains ios/)
      #   esim_ble/   local path dependency (pubspec: path: ../esim_ble)
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The vendored xcframework is stored in Git LFS.
          lfs: true

      # Flutter SDK is fetched manually instead of via subosito/flutter-action.
      # The action's setup.sh kept dying mid-download (curl exit 56 "recv
      # failure" / exit 92) on both macos-14 and macos-15, which is a plain
      # network reset on the ~1 GB archive. curl with retry/resume and a
      # sha256 check is far more reliable than a single-shot download.
      # Pin the Xcode version explicitly. The default Xcode on macos-14/macos-15
      # images trails the Swift toolchain that generated some plugin code.
      # shared_preferences_foundation's Pigeon output uses trailing commas in an
      # @objc initializer parameter list, which older @objc parsers reject with
      # "unexpected ',' separator". A current Xcode accepts it.
      # The vendored eSIMManagerSDK was built with Swift 6.3.3 and its
      # swiftinterface references RawSpan, a type that did not exist before
      # Swift 6.2. Any Swift 6.0 compiler rejects the whole module, so the
      # build must run on Xcode 26.x.
      #
      # macos-15 defaults to Xcode 16.4, so pick the highest Xcode 26 on the
      # image. A plain `sort -V | tail -1` picks the wrong one: version sort
      # ranks 16.4.x above 26.x in some orderings, which is exactly how the
      # default toolchain ended up being used.
      - name: Select Xcode
        run: |
          set -euo pipefail
          echo "Available Xcode versions:"
          ls -1d /Applications/Xcode*.app || true

          # Parse major.minor.patch out of each app name and sort numerically.
          # Shell sort variants are unreliable here (the image exposes both
          # Xcode_15.0.app and Xcode_15.0.1.app, and a plain version sort did
          # not rank 26.x above 16.x), so let Python do the comparison.
          LATEST=$(/usr/bin/python3 - <<'PY'
          import glob, os, re
          best = None
          for p in glob.glob('/Applications/Xcode*.app'):
              m = re.search(r'Xcode_?(\d+(?:\.\d+)*)', os.path.basename(p))
              if not m:
                  continue  # skip the unversioned /Applications/Xcode.app alias
              key = tuple(int(x) for x in m.group(1).split('.'))
              key = key + (0,) * (4 - len(key))
              if best is None or key > best[0]:
                  best = (key, p)
          print(best[1] if best else '')
          PY
          )

          if [ -z "$LATEST" ]; then
            echo "ERROR: no versioned Xcode.app found under /Applications" >&2
            ls -la /Applications | head -40 >&2
            exit 1
          fi

          echo "Selecting: $LATEST"
          sudo xcode-select -switch "$LATEST/Contents/Developer"
          xcodebuild -version
          swift --version

          # The vendored SDK's swiftinterface uses RawSpan (Swift 6.2+), so a
          # 6.0 toolchain cannot even parse the module. Fail loudly.
          SWIFT_VER=$(swift --version | head -1 | sed -E 's/.*version ([0-9]+\.[0-9]+).*/\1/')
          echo "Detected Swift $SWIFT_VER"
          MAJOR=${SWIFT_VER%%.*}
          MINOR=${SWIFT_VER#*.}
          if [ "$MAJOR" -lt 6 ] || { [ "$MAJOR" -eq 6 ] && [ "$MINOR" -lt 2 ]; }; then
            echo "ERROR: Swift $SWIFT_VER cannot load eSIMManagerSDK (needs >= 6.2)." >&2
            echo "Selected Xcode: $LATEST (too old for the vendored SDK)." >&2
            echo "This runner image does not provide Xcode 26.x." >&2
            exit 1
          fi

      - name: Setup Flutter
        run: |
          set -euo pipefail
          FLUTTER_VERSION=3.47.8
          FLUTTER_HOME="$HOME/flutter"
          if [ -x "$FLUTTER_HOME/bin/flutter" ]; then
            echo "Flutter already present, skipping download"
          else
            URL="https://storage.googleapis.com/flutter_infra_release/releases/stable/macos/flutter_macos_${FLUTTER_VERSION}-stable.zip"
            ZIP="$RUNNER_TEMP/flutter.zip"
            echo "Downloading $URL"
            # --retry with resume: network resets restart from where they left off
            curl -fL --retry 5 --retry-delay 5 --retry-all-errors \
                 -C - --connect-timeout 30 --max-time 1800 \
                 -o "$ZIP" "$URL"
            ls -lh "$ZIP"
            unzip -q "$ZIP" -d "$HOME"
            rm -f "$ZIP"
          fi
          echo "$FLUTTER_HOME/bin" >> "$GITHUB_PATH"
          "$FLUTTER_HOME/bin/flutter" --version

      - name: Verify vendored SDK
        working-directory: esim_app
        run: |
          FW="ios/Frameworks/eSIMManagerSDK.xcframework"
          BIN="$FW/ios-arm64/eSIMManagerSDK.framework/eSIMManagerSDK"
          SPEC="ios/Frameworks/eSIMManagerSDK.podspec"
          for f in "$FW/Info.plist" "$BIN" "$SPEC"; do
            if [ ! -e "$f" ]; then
              echo "ERROR: missing vendored SDK artefact: $f" >&2
              echo "The xcframework must be committed under ios/Frameworks (Git LFS pulled)." >&2
              exit 1
            fi
          done
          SIZE=$(stat -f%z "$BIN")
          echo "SDK binary size: $SIZE bytes"
          # Real binary is ~27 MB. A tiny file means an LFS pointer got committed.
          if [ "$SIZE" -lt 10000000 ]; then
            echo "ERROR: SDK binary looks like an LFS pointer ($SIZE bytes)." >&2
            exit 1
          fi
          echo "Vendored SDK OK"

      # Alipay SDK ships as a CocoaPod only -- there is no Swift Package
      # Manager version of it. Flutter enables SPM by default on recent
      # versions, which means pods get installed but never linked, and
      # `#if canImport(AlipaySDK)` evaluates to false at compile time.
      # Turning SPM off before `pod install` puts every plugin back on the
      # Pods path, which is what the rest of this workflow already assumes.
      - name: Use CocoaPods instead of Swift Package Manager
        working-directory: esim_app
        run: |
          flutter config --no-enable-swift-package-manager
          flutter config --list | grep swift-package-manager

      - name: Resolve dependencies
        working-directory: esim_app
        run: |
          flutter --version
          flutter pub get --enforce-lockfile

      - name: Install CocoaPods deps
        working-directory: esim_app/ios
        run: pod install --repo-update

      # Toolchain workaround.
      #
      # shared_preferences_foundation ships Pigeon-generated Swift that ends an
      # @objc initializer parameter list with a trailing comma:
      #
      #     @objc required init(
      #       number: NSNumber,
      #       type: Int,        <- trailing comma
      #     ) {
      #
      # Trailing commas in @objc parameter lists are rejected by every Xcode on
      # the runner images (verified on macos-14 default and newest Xcode), with
      # "unexpected ',' separator" at messages.g.swift:33, :357 and :362.
      # Selecting a newer Xcode did not help, so strip the offending commas from
      # the cached package before the build runs.
      #
      # The file is generated output in the pub cache, not project source, so
      # patching it here is safe and does not touch the repository.
      - name: Patch plugin Swift for older toolchain
        run: |
          set -euo pipefail
          PKG="$HOME/.pub-cache/hosted/pub.dev/shared_preferences_foundation-2.6.0"
          TARGET="$PKG/darwin/shared_preferences_foundation/Sources/shared_preferences_foundation/messages.g.swift"
          if [ ! -f "$TARGET" ]; then
            echo "Target not found, searching pub cache:"
            find "$HOME/.pub-cache/hosted" -maxdepth 3 -type d -name 'shared_preferences_foundation-*' || true
            exit 1
          fi
          echo "Before: $(grep -c ',$' "$TARGET" || true) lines end with a comma"
          # Remove a comma that is immediately followed by a closing paren.
          # Done with perl -0777 so the match can span the newline, which keeps
          # this free of any indentation-sensitive embedded script.
          perl -0777 -i -pe 's/,\s*\n(\s*)\)/\n$1)/g' "$TARGET"
          echo "After: $(grep -c ',$' "$TARGET" || true) lines end with a comma"
          echo "Line 33 now: $(sed -n '33p' "$TARGET")"
          echo "Line 357 now: $(sed -n '357p' "$TARGET")"
          echo "Line 362 now: $(sed -n '362p' "$TARGET")"

      # ---------- unsigned ----------
      - name: Build iOS (unsigned)
        if: env.HAS_SIGNING != 'true'
        working-directory: esim_app
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        if: env.HAS_SIGNING != 'true'
        working-directory: esim_app/build/ios/iphoneos
        run: |
          mkdir -p Payload
          cp -R Runner.app Payload/
          OUT="$GITHUB_WORKSPACE/esim_app-unsigned.ipa"
          rm -f "$OUT"
          zip -qry "$OUT" Payload
          ls -lh "$OUT"

      # ---------- signed ----------
      - name: Import signing certificate
        if: env.HAS_SIGNING == 'true'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

      - name: Install provisioning profile
        if: env.HAS_SIGNING == 'true'
        env:
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          PP_PATH="$RUNNER_TEMP/build_pp.mobileprovision"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Build iOS (signed)
        if: env.HAS_SIGNING == 'true'
        working-directory: esim_app
        env:
          FLUTTER_XCODE_CODE_SIGN_STYLE: Manual
          FLUTTER_XCODE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          FLUTTER_XCODE_PROVISIONING_PROFILE_SPECIFIER: ${{ secrets.PROVISIONING_PROFILE_NAME }}
        run: |
          flutter build ipa --release \
            --export-options-plist=ios/ExportOptions.plist \
            --build-number=${{ github.run_number }}

      # ---------- artifacts ----------
      - name: Upload unsigned IPA
        if: env.HAS_SIGNING != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: esim_app-unsigned-ipa
          path: esim_app-unsigned.ipa
          retention-days: 14

      - name: Upload signed IPA
        if: env.HAS_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: esim_app-signed-ipa
          path: esim_app/build/ios/ipa/*.ipa
          retention-days: 14

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            esim_app/build/ios/**/*.log
            esim_app/ios/Pods/**/*.log
          retention-days: 7
          if-no-files-found: ignore
