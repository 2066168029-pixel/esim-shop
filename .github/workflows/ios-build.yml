name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Detect whether the Apple signing secrets are configured.
  detect:
    name: Detect signing setup
    runs-on: ubuntu-latest
    outputs:
      has_signing: ${{ steps.check.outputs.has_signing }}
    steps:
      - id: check
        env:
          CERT: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          PROFILE: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$CERT" ] && [ -n "$PROFILE" ] && [ -n "$TEAM" ]; then
            echo "has_signing=true" >> "$GITHUB_OUTPUT"
            echo "Signing secrets found -> signed build"
          else
            echo "has_signing=false" >> "$GITHUB_OUTPUT"
            echo "No signing secrets -> unsigned build (cannot install on device)"
          fi

  build-ios:
    name: Build iOS
    needs: detect
    runs-on: macos-15
    timeout-minutes: 60
    env:
      HAS_SIGNING: ${{ needs.detect.outputs.has_signing }}
      # Mirrors match the mirror used by the local pub cache (pub.flutter-io.cn).
      # Override via repository variables if your runner can reach the
      # official registries directly.
      PUB_HOSTED_URL: ${{ vars.PUB_HOSTED_URL || 'https://pub.flutter-io.cn' }}
      FLUTTER_STORAGE_BASE_URL: ${{ vars.FLUTTER_STORAGE_BASE_URL || 'https://storage.flutter-io.cn' }}
      COCOAPODS_DISABLE_STATS: 'true'

    steps:
      # Repository layout:
      #   esim_app/   Flutter app (contains ios/)
      #   esim_ble/   local path dependency (pubspec: path: ../esim_ble)
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The vendored xcframework is stored in Git LFS.
          lfs: true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true

      - name: Verify vendored SDK
        working-directory: esim_app
        run: |
          FW="ios/Frameworks/eSIMManagerSDK.xcframework"
          BIN="$FW/ios-arm64/eSIMManagerSDK.framework/eSIMManagerSDK"
          SPEC="ios/Frameworks/eSIMManagerSDK.podspec"
          for f in "$FW/Info.plist" "$BIN" "$SPEC"; do
            if [ ! -e "$f" ]; then
              echo "ERROR: missing vendored SDK artefact: $f" >&2
              echo "The xcframework must be committed under ios/Frameworks (Git LFS pulled)." >&2
              exit 1
            fi
          done
          SIZE=$(stat -f%z "$BIN")
          echo "SDK binary size: $SIZE bytes"
          # Real binary is ~27 MB. A tiny file means an LFS pointer got committed.
          if [ "$SIZE" -lt 10000000 ]; then
            echo "ERROR: SDK binary looks like an LFS pointer ($SIZE bytes)." >&2
            exit 1
          fi
          echo "Vendored SDK OK"

      - name: Resolve dependencies
        working-directory: esim_app
        run: |
          flutter --version
          flutter pub get

      - name: Install CocoaPods deps
        working-directory: esim_app/ios
        run: pod install --repo-update

      # ---------- unsigned ----------
      - name: Build iOS (unsigned)
        if: env.HAS_SIGNING != 'true'
        working-directory: esim_app
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        if: env.HAS_SIGNING != 'true'
        working-directory: esim_app/build/ios/iphoneos
        run: |
          mkdir -p Payload
          cp -R Runner.app Payload/
          OUT="$GITHUB_WORKSPACE/esim_app-unsigned.ipa"
          rm -f "$OUT"
          zip -qry "$OUT" Payload
          ls -lh "$OUT"

      # ---------- signed ----------
      - name: Import signing certificate
        if: env.HAS_SIGNING == 'true'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

      - name: Install provisioning profile
        if: env.HAS_SIGNING == 'true'
        env:
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          PP_PATH="$RUNNER_TEMP/build_pp.mobileprovision"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Build iOS (signed)
        if: env.HAS_SIGNING == 'true'
        working-directory: esim_app
        env:
          FLUTTER_XCODE_CODE_SIGN_STYLE: Manual
          FLUTTER_XCODE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          FLUTTER_XCODE_PROVISIONING_PROFILE_SPECIFIER: ${{ secrets.PROVISIONING_PROFILE_NAME }}
        run: |
          flutter build ipa --release \
            --export-options-plist=ios/ExportOptions.plist \
            --build-number=${{ github.run_number }}

      # ---------- artifacts ----------
      - name: Upload unsigned IPA
        if: env.HAS_SIGNING != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: esim_app-unsigned-ipa
          path: esim_app-unsigned.ipa
          retention-days: 14

      - name: Upload signed IPA
        if: env.HAS_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: esim_app-signed-ipa
          path: esim_app/build/ios/ipa/*.ipa
          retention-days: 14

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            esim_app/build/ios/**/*.log
            esim_app/ios/Pods/**/*.log
          retention-days: 7
          if-no-files-found: ignore
