name: iOS Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # Detect whether signing secrets are configured.
  detect:
    name: Detect signing setup
    runs-on: ubuntu-latest
    outputs:
      has_signing: ${{ steps.check.outputs.has_signing }}
    steps:
      - id: check
        env:
          CERT: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          PROFILE: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$CERT" ] && [ -n "$PROFILE" ] && [ -n "$TEAM" ]; then
            echo "has_signing=true" >> $GITHUB_OUTPUT
            echo "Signing secrets found -> signed build"
          else
            echo "has_signing=false" >> $GITHUB_OUTPUT
            echo "No signing secrets -> unsigned build (device-install not possible)"
          fi

  build-ios:
    name: Build iOS
    needs: detect
    runs-on: macos-14
    timeout-minutes: 60
    env:
      HAS_SIGNING: ${{ needs.detect.outputs.has_signing }}
      # Mirrors: matches the pub mirror used locally (pub.flutter-io.cn).
      # Comment out if your runner has direct access to the official registries.
      PUB_HOSTED_URL: ${{ vars.PUB_HOSTED_URL || 'https://pub.flutter-io.cn' }}
      FLUTTER_STORAGE_BASE_URL: ${{ vars.FLUTTER_STORAGE_BASE_URL || 'https://storage.flutter-io.cn' }}
      COCOAPODS_DISABLE_STATS: 'true'

    steps:
      # Repo layout note:
      #   esim_app  -> Flutter app  (this project)
      #   esim_ble  -> local path dependency (pubspec: path: ../esim_ble)
      # Both must be checked out as siblings, so we set the checkout path to
      # the parent dir and work inside the app dir.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: repo
          # Pull the vendored xcframework through Git LFS.
          lfs: true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true

      - name: Locate app directory
        id: locate
        run: |
          if [ -f "repo/esim_app/pubspec.yaml" ]; then
            echo "app_dir=repo/esim_app" >> $GITHUB_OUTPUT
          elif [ -f "repo/pubspec.yaml" ]; then
            echo "app_dir=repo" >> $GITHUB_OUTPUT
          else
            echo "Cannot find pubspec.yaml (looked in repo/esim_app and repo)" >&2
            exit 1
          fi

      - name: Verify path dependency
        run: |
          APP="${{ steps.locate.outputs.app_dir }}"
          SIBLING="$(dirname "$APP")/esim_ble"
          if grep -q 'path: ../esim_ble' "$APP/pubspec.yaml"; then
            if [ -f "$SIBLING/pubspec.yaml" ]; then
              echo "OK: esim_ble sibling found at $SIBLING"
            else
              echo "ERROR: pubspec references 'path: ../esim_ble' but $SIBLING is missing." >&2
              echo "Make sure esim_ble is committed to the repo next to esim_app." >&2
              exit 1
            fi
          fi

      - name: Verify vendored SDK
        working-directory: ${{ steps.locate.outputs.app_dir }}
        run: |
          FW="ios/Frameworks/eSIMManagerSDK.xcframework"
          BIN="$FW/ios-arm64/eSIMManagerSDK.framework/eSIMManagerSDK"
          SPEC="ios/Frameworks/eSIMManagerSDK.podspec"
          for f in "$FW/Info.plist" "$BIN" "$SPEC"; do
            if [ ! -e "$f" ]; then
              echo "ERROR: missing vendored SDK artefact: $f" >&2
              echo "The xcframework must be committed under ios/Frameworks (git-lfs must be pulled)." >&2
              exit 1
            fi
          done
          SIZE=$(stat -f%z "$BIN")
          echo "SDK binary size: $SIZE bytes"
          # The real binary is ~28 MB. A tiny file means LFS pointer/truncation.
          if [ "$SIZE" -lt 10000000 ]; then
            echo "ERROR: SDK binary looks truncated ($SIZE bytes, expected ~28MB)." >&2
            echo "Check that Git LFS is configured and files are pulled." >&2
            exit 1
          fi
          echo "Vendored SDK OK"

      - name: Resolve dependencies
        working-directory: ${{ steps.locate.outputs.app_dir }}
        run: |
          flutter --version
          flutter pub get

      - name: Install CocoaPods deps
        working-directory: ${{ steps.locate.outputs.app_dir }}/ios
        run: pod install --repo-update

      # ---------- unsigned ----------
      - name: Build iOS (unsigned)
        if: env.HAS_SIGNING != 'true'
        working-directory: ${{ steps.locate.outputs.app_dir }}
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        if: env.HAS_SIGNING != 'true'
        working-directory: ${{ steps.locate.outputs.app_dir }}/build/ios/iphoneos
        run: |
          mkdir -p Payload
          cp -R Runner.app Payload/
          OUT="$GITHUB_WORKSPACE/repo/esim_app-unsigned.ipa"
          rm -f "$OUT"
          zip -qry "$OUT" Payload
          ls -lh "$OUT"

      # ---------- signed ----------
      - name: Import signing certificate
        if: env.HAS_SIGNING == 'true'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERT_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERT_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | tr -d '"')

      - name: Install provisioning profile
        if: env.HAS_SIGNING == 'true'
        env:
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Build iOS (signed)
        if: env.HAS_SIGNING == 'true'
        working-directory: ${{ steps.locate.outputs.app_dir }}
        env:
          FLUTTER_XCODE_CODE_SIGN_STYLE: Manual
          FLUTTER_XCODE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          FLUTTER_XCODE_PROVISIONING_PROFILE_SPECIFIER: ${{ secrets.PROVISIONING_PROFILE_NAME }}
        run: |
          flutter build ipa --release \
            --export-options-plist=ios/ExportOptions.plist \
            --build-number=${{ github.run_number }}

      # ---------- artifacts ----------
      - name: Upload unsigned IPA
        if: env.HAS_SIGNING != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: esim_app-unsigned-ipa
          path: repo/esim_app-unsigned.ipa
          retention-days: 14

      - name: Upload signed IPA
        if: env.HAS_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: esim_app-signed-ipa
          path: repo/esim_app/build/ios/ipa/*.ipa
          retention-days: 14

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            repo/esim_app/build/ios/**/*.log
            repo/esim_app/ios/Pods/**/*.log
          retention-days: 7
          if-no-files-found: ignore
